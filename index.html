<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>আদর্শ শিশু কানন স্কুল</title>
    <meta name="description" content="কাশিম বাজার, সুন্দরগঞ্জ, গাইবান্ধার আদর্শ শিশু কানন স্কুলের অফিসিয়াল ওয়েবসাইট" />
    
    <!-- OpenGraph & SEO -->
    <meta property="og:title" content="আদর্শ শিশু কানন স্কুল" />
    <meta property="og:description" content="কাশিম বাজার, সুন্দরগঞ্জ, গাইবান্ধার আদর্শ শিশু কানন স্কুলের অফিসিয়াল ওয়েবসাইট" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/pwa-512x512.png" />

    <!-- Android & PWA Meta -->
    <meta name="theme-color" content="#1e3a8a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="আদর্শ শিশু কানন স্কুল " />

    <!-- iOS Safari Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="আদর্শ শিশু কানন স্কুল " />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Icons -->
    <link id="app-favicon" rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link id="app-alternate-icon" rel="alternate icon" type="image/png" href="/pwa-192x192.png" />
    <link id="app-shortcut-icon" rel="shortcut icon" href="/favicon.ico" />

    <!-- Immediate dynamic icon synchronization from cached settings -->
    <script>
      (function() {
        try {
          var cachedIcons = localStorage.getItem('adarsha_dynamic_icons_cache_v2');
          var iconUrl = null;
          if (cachedIcons) {
            var parsed = JSON.parse(cachedIcons);
            if (parsed && parsed.icons && parsed.icons.icon192) {
              iconUrl = parsed.icons.icon192;
            }
          }
          if (!iconUrl) {
            var schoolInfo = localStorage.getItem('adarsha_school_info_v2');
            if (schoolInfo) {
              var sObj = JSON.parse(schoolInfo);
              if (sObj && sObj.logoUrl) {
                iconUrl = sObj.logoUrl;
              }
            }
          }
          if (iconUrl) {
            var fav = document.getElementById('app-favicon');
            if (fav) { fav.href = iconUrl; fav.type = 'image/png'; }
            var apple = document.querySelector("link[rel='apple-touch-icon']");
            if (apple) { apple.href = iconUrl; }
            var shortcut = document.getElementById('app-shortcut-icon');
            if (shortcut) { shortcut.href = iconUrl; }
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-blue-900 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

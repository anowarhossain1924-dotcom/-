    <circle cx="256" cy="256" r="230" fill="none" stroke="#f59e0b" stroke-width="10" />

    <!-- Sun Arc -->
    <path d="M 176 210 A 80 80 0 0 1 336 210 Z" fill="url(#mGoldGrad)" />


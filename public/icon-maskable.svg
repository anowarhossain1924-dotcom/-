      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#172554" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="mGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Full Bleed Background for Android adaptive icon cropping -->
  <rect width="512" height="512" fill="url(#mBgGrad)" />

  <!-- Inner Content scaled into 80% safe zone with transform -->
  <g transform="translate(51.2, 51.2) scale(0.8)">

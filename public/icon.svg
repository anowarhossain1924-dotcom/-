<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#172554" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Circular Outer Frame -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" stroke="#f59e0b" stroke-width="12" />
  <circle cx="256" cy="256" r="230" fill="none" stroke="#fef08a" stroke-width="2" stroke-dasharray="6,6" opacity="0.6" />

  <!-- Sun Rays of Knowledge -->
  <g opacity="0.15" stroke="#f59e0b" stroke-width="4">
    <line x1="256" y1="90" x2="256" y2="40" />
    <line x1="160" y1="130" x2="120" y2="90" />
    <line x1="352" y1="130" x2="392" y2="90" />
    <line x1="100" y1="210" x2="50" y2="200" />
    <line x1="412" y1="210" x2="462" y2="200" />
  </g>

  <!-- Sun Arc -->
  <path d="M 176 210 A 80 80 0 0 1 336 210 Z" fill="url(#goldGrad)" />

  <!-- Graduation Cap -->
  <g filter="url(#glow)">
    <!-- Cap top diamond -->
    <polygon points="256,120 370,165 256,205 142,165" fill="#f59e0b" stroke="#ffffff" stroke-width="3" />
    <!-- Cap skull base -->
    <path d="M 180 183 L 180 220 C 180 245 332 245 332 220 L 332 183" fill="#d97706" />
    <!-- Cap tassel -->
    <path d="M 360 170 Q 375 200 372 235" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" />
    <circle cx="372" cy="240" r="6" fill="#fef08a" />
  </g>

  <!-- Open Book Symbol of Education -->
  <g filter="url(#glow)">
    <!-- Book Backing -->
    <path d="M 130 330 C 180 300 240 315 256 335 C 272 315 332 300 382 330 L 382 355 C 332 325 272 340 256 360 C 240 340 180 325 130 355 Z" fill="#b45309" />
    <!-- Left Page -->
    <path d="M 130 320 C 180 290 240 305 256 325 L 256 350 C 240 330 180 315 130 345 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
    <!-- Right Page -->
    <path d="M 382 320 C 332 290 272 305 256 325 L 256 350 C 272 330 332 315 382 345 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
    <!-- Text Lines on Pages -->
    <line x1="155" y1="316" x2="235" y2="310" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="155" y1="326" x2="235" y2="320" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="277" y1="310" x2="357" y2="316" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="277" y1="320" x2="357" y2="326" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Laurel Wreath (Success & Growth) -->
  <g fill="#10b981" opacity="0.9">
    <ellipse cx="110" cy="240" rx="14" ry="7" transform="rotate(-35, 110, 240)" />
    <ellipse cx="100" cy="275" rx="14" ry="7" transform="rotate(-15, 100, 275)" />
    <ellipse cx="100" cy="310" rx="14" ry="7" transform="rotate(10, 100, 310)" />
    <ellipse cx="112" cy="345" rx="14" ry="7" transform="rotate(30, 112, 345)" />

    <ellipse cx="402" cy="240" rx="14" ry="7" transform="rotate(35, 402, 240)" />
    <ellipse cx="412" cy="275" rx="14" ry="7" transform="rotate(15, 412, 275)" />
    <ellipse cx="412" cy="310" rx="14" ry="7" transform="rotate(-10, 412, 310)" />
    <ellipse cx="400" cy="345" rx="14" ry="7" transform="rotate(-30, 400, 345)" />
  </g>

  <!-- School Ribbon / Banner -->
  <g filter="url(#glow)">
    <path d="M 120 405 L 80 435 L 120 445 L 392 445 L 432 435 L 392 405 Z" fill="#b45309" />
    <rect x="110" y="395" width="292" height="42" rx="8" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="2" />
    <text x="256" y="423" font-family="system-ui, sans-serif" font-size="20" font-weight="900" text-anchor="middle" fill="#1e3a8a">
      ESTD - 2011
    </text>
  </g>

  <!-- Stars -->
  <polygon points="256,70 260,80 271,81 262,88 265,99 256,92 247,99 250,88 241,81 252,80" fill="#fef08a" />
</svg>
